name: 설치 파일 만들기
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk OldHangulKeyboard.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest OldHangulKeyboard.apk -t "옛한글 자판 최신판" -n "휴대폰에서 OldHangulKeyboard.apk 를 눌러 내려받아 설치하세요. (AI 작성 초안 → 상담자 검증 필수)"
      - uses: actions/upload-artifact@v4
        with:
          name: OldHangulKeyboard
          path: OldHangulKeyboard.apk
